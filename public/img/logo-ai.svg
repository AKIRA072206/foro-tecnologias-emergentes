    <line x1="28" y1="68" x2="48" y2="58"/>
    <line x1="92" y1="68" x2="72" y2="58"/>
    <line x1="60" y1="86" x2="60" y2="66"/>
    <line x1="48" y1="48" x2="72" y2="48"/>
    <line x1="48" y1="58" x2="72" y2="58"/>
    <line x1="48" y1="48" x2="48" y2="58"/>
    <line x1="72" y1="48" x2="72" y2="58"/>
